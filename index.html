<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>vsllm GPT绘图工作台</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 隐藏原生的滚动条以追求极致 UI，但保留滚动功能 */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #9ca3af; }
        
        .loader-dots div {
            animation-timing-function: cubic-bezier(0, 1, 1, 0);
        }
        .loader-dots div:nth-child(1) { left: 8px; animation: loader-dots1 0.6s infinite; }
        .loader-dots div:nth-child(2) { left: 8px; animation: loader-dots2 0.6s infinite; }
        .loader-dots div:nth-child(3) { left: 32px; animation: loader-dots2 0.6s infinite; }
        .loader-dots div:nth-child(4) { left: 56px; animation: loader-dots3 0.6s infinite; }
        @keyframes loader-dots1 { 0% { transform: scale(0); } 100% { transform: scale(1); } }
        @keyframes loader-dots3 { 0% { transform: scale(1); } 100% { transform: scale(0); } }
        @keyframes loader-dots2 { 0% { transform: translate(0, 0); } 100% { transform: translate(24px, 0); } }
        
        /* 确保输入框不会被移动端键盘遮挡 */
        #input-container { padding-bottom: env(safe-area-inset-bottom); }
    </style>
</head>
<body class="bg-white text-gray-800 h-screen w-screen overflow-hidden flex font-sans">

    <!-- 侧边栏：我的图库 -->
    <aside id="sidebar" class="fixed md:relative z-40 h-full w-64 bg-gray-50 border-r border-gray-200 flex flex-col transition-transform duration-300 -translate-x-full md:translate-x-0">
        <div class="h-14 flex items-center justify-between px-4 border-b border-gray-200 shrink-0">
            <span class="font-semibold text-gray-700 flex items-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                本地图库
            </span>
            <button onclick="toggleSidebar()" class="md:hidden text-gray-500 hover:text-gray-700 p-1">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>
        <div id="gallery-container" class="flex-1 overflow-y-auto p-3 grid grid-cols-2 gap-2 content-start">
            <!-- 历史图片渲染区 -->
        </div>
        <div class="p-3 border-t border-gray-200 text-xs text-gray-400 text-center shrink-0">
            图片存储于浏览器本地
        </div>
    </aside>

    <!-- 侧边栏遮罩（移动端） -->
    <div id="sidebar-overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-black bg-opacity-50 z-30 hidden md:hidden transition-opacity"></div>

    <!-- 主对话区 -->
    <main class="flex-1 flex flex-col h-full relative min-w-0">
        <!-- 顶部导航 -->
        <header class="h-14 flex items-center justify-between px-4 border-b border-gray-200 shrink-0">
            <button onclick="toggleSidebar()" class="p-2 text-gray-600 hover:text-gray-900 md:hidden rounded-md hover:bg-gray-100">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
            </button>
            <div class="font-medium text-lg flex items-center gap-2 flex-1 justify-center md:justify-start md:pl-4">
                <svg class="w-5 h-5 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"></path></svg>
                vsllm 绘图工作台
            </div>
            <button onclick="openSettings()" class="p-2 text-gray-600 hover:text-gray-900 rounded-md hover:bg-gray-100" title="设置">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
            </button>
        </header>

        <!-- 聊天流 -->
        <div id="chat-container" class="flex-1 overflow-y-auto p-4 flex flex-col gap-6 w-full max-w-4xl mx-auto scroll-smooth">
            <!-- Bot 欢迎语 -->
            <div class="flex gap-4 items-start w-full">
                <div class="w-8 h-8 rounded-full bg-indigo-100 flex items-center justify-center shrink-0 border border-indigo-200">
                    <svg class="w-5 h-5 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"></path></svg>
                </div>
                <div class="flex-1 pt-1 text-gray-800 leading-relaxed max-w-prose">
                    你好！请在下方输入画面描述。<br>支持点击附件图标上传多张图片作为参考。
                </div>
            </div>
        </div>

        <!-- 输入区 -->
        <div id="input-container" class="w-full shrink-0 bg-white border-t border-gray-100 md:border-transparent pt-2 pb-4 px-4">
            <div class="max-w-4xl mx-auto">
                <div class="flex flex-col bg-gray-50 border border-gray-300 rounded-2xl shadow-sm focus-within:ring-1 focus-within:ring-black focus-within:border-black transition-all">
                    
                    <!-- 预览缩略图区 -->
                    <div id="image-preview-bar" class="hidden flex gap-2 px-3 pt-3 overflow-x-auto">
                        <!-- JS 动态注入缩略图 -->
                    </div>

                    <!-- 文本框与按钮栏 -->
                    <div class="flex items-end gap-2 p-2 relative">
                        <!-- 附件按钮 -->
                        <button onclick="document.getElementById('file-upload').click()" class="p-2 text-gray-500 hover:text-black rounded-lg hover:bg-gray-200 transition-colors shrink-0" title="上传图片">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13"></path></svg>
                        </button>
                        <input type="file" id="file-upload" multiple accept="image/*" class="hidden" onchange="handleFilesSelect(event)">

                        <!-- 自动伸缩文本框 -->
                        <textarea id="prompt-input" rows="1" placeholder="发送指令，例如：生成一只赛博朋克风格的猫" class="flex-1 max-h-40 bg-transparent resize-none outline-none py-2 text-gray-800 text-[15px] leading-normal" oninput="autoResizeTextarea(this)" onkeydown="handleEnter(event)"></textarea>

                        <!-- 发送按钮 -->
                        <button id="send-btn" onclick="sendMessage()" class="p-2 bg-black text-white rounded-xl hover:bg-gray-800 disabled:bg-gray-300 disabled:cursor-not-allowed transition-colors shrink-0 flex items-center justify-center">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 10l7-7m0 0l7 7m-7-7v18"></path></svg>
                        </button>
                    </div>
                </div>
                
                <div class="text-center mt-2 text-xs text-gray-400">
                    当前使用模型: <span class="font-mono bg-gray-100 px-1 rounded text-gray-500">gpt-image-2-chat</span>
                </div>
            </div>
        </div>
    </main>

    <!-- 设置模态框 -->
    <div id="settings-modal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex justify-center items-center p-4">
        <div class="bg-white rounded-2xl w-full max-w-md p-6 shadow-2xl transform transition-all">
            <h3 class="text-xl font-semibold mb-2 text-gray-800 text-center">配置 API 密钥</h3>
            <p class="text-sm text-gray-500 text-center mb-6">
                请前往 <a href="https://vsllm.com" target="_blank" class="text-indigo-600 hover:underline">https://vsllm.com</a> 获取您的专属密钥<br>密钥仅保存在您的本地浏览器中。
            </p>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">API Key</label>
                    <input type="password" id="api-key-input" placeholder="sk-..." class="w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-xl focus:ring-2 focus:ring-black focus:border-black outline-none transition-all">
                </div>
                <button onclick="saveSettings()" class="w-full bg-black text-white py-3 rounded-xl hover:bg-gray-800 transition-colors font-medium">
                    保存并开始使用
                </button>
            </div>
            <button onclick="closeSettings()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>
    </div>

    <!-- 逻辑脚本 -->
    <script>
        const BASE_URL = "https://vsllm.com/v1/responses";
        const MODEL = "gpt-image-2-chat";

        // DOM 节点
        const chatContainer = document.getElementById('chat-container');
        const promptInput = document.getElementById('prompt-input');
        const sendBtn = document.getElementById('send-btn');
        const imagePreviewBar = document.getElementById('image-preview-bar');
        
        let pendingImages = []; // 暂存用户选择的 Base64 图片组

        // ============== 初始化与配置 ==============
        window.onload = async () => {
            await initDB();
            loadGallery();
            const apiKey = localStorage.getItem('vsllm_api_key');
            if (!apiKey) {
                openSettings();
            }
        };

        function openSettings() {
            document.getElementById('api-key-input').value = localStorage.getItem('vsllm_api_key') || '';
            document.getElementById('settings-modal').classList.remove('hidden');
        }

        function closeSettings() {
            if(!localStorage.getItem('vsllm_api_key')){
                alert("请先填写并保存 API 密钥才能正常使用哦！");
                return;
            }
            document.getElementById('settings-modal').classList.add('hidden');
        }

        function saveSettings() {
            const key = document.getElementById('api-key-input').value.trim();
            if (!key.startsWith('sk-')) {
                alert('请填写正确的 API Key (通常以 sk- 开头)');
                return;
            }
            localStorage.setItem('vsllm_api_key', key);
            document.getElementById('settings-modal').classList.add('hidden');
        }

        // ============== 侧边栏控制 ==============
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            if (sidebar.classList.contains('-translate-x-full')) {
                sidebar.classList.remove('-translate-x-full');
                overlay.classList.remove('hidden');
            } else {
                sidebar.classList.add('-translate-x-full');
                overlay.classList.add('hidden');
            }
        }

        // ============== 交互辅助 ==============
        function autoResizeTextarea(el) {
            el.style.height = 'auto';
            el.style.height = (el.scrollHeight < 160 ? el.scrollHeight : 160) + 'px';
        }

        function handleEnter(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        function scrollToBottom() {
            chatContainer.scrollTo({ top: chatContainer.scrollHeight, behavior: 'smooth' });
        }

        // ============== 图片上传与前端压缩 ==============
        async function handleFilesSelect(e) {
            const files = e.target.files;
            if (!files || files.length === 0) return;

            for (let file of files) {
                const base64 = await compressImage(file);
                pendingImages.push(base64);
            }
            renderImagePreviews();
            e.target.value = ''; // 清空 file input 状态
        }

        // 压缩图片并转为 Base64 (防止多图把 Payload 撑爆导致超时或 413)
        function compressImage(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_SIZE = 1024;
                        let width = img.width;
                        let height = img.height;

                        if (width > height && width > MAX_SIZE) {
                            height *= MAX_SIZE / width;
                            width = MAX_SIZE;
                        } else if (height > MAX_SIZE) {
                            width *= MAX_SIZE / height;
                            height = MAX_SIZE;
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', 0.8));
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        function renderImagePreviews() {
            if (pendingImages.length === 0) {
                imagePreviewBar.classList.add('hidden');
                imagePreviewBar.innerHTML = '';
                return;
            }
            imagePreviewBar.classList.remove('hidden');
            imagePreviewBar.innerHTML = pendingImages.map((b64, index) => `
                <div class="relative w-16 h-16 shrink-0 rounded-lg overflow-hidden border border-gray-200 group">
                    <img src="${b64}" class="w-full h-full object-cover">
                    <button onclick="removePendingImage(${index})" class="absolute top-1 right-1 bg-black bg-opacity-60 text-white rounded-full p-1 opacity-0 group-hover:opacity-100 transition-opacity">
                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                    </button>
                </div>
            `).join('');
        }

        function removePendingImage(index) {
            pendingImages.splice(index, 1);
            renderImagePreviews();
        }

        // ============== 消息渲染 ==============
        function appendUserMessage(text, images) {
            const msgDiv = document.createElement('div');
            msgDiv.className = 'flex gap-4 items-start w-full flex-row-reverse';
            
            let imgHtml = '';
            if (images && images.length > 0) {
                imgHtml = `<div class="flex flex-wrap gap-2 mb-2 justify-end">` + 
                          images.map(src => `<img src="${src}" class="w-24 h-24 object-cover rounded-lg border border-gray-200">`).join('') +
                          `</div>`;
            }

            msgDiv.innerHTML = `
                <div class="w-8 h-8 rounded-full bg-gray-200 flex items-center justify-center shrink-0">
                    <svg class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                </div>
                <div class="flex-1 flex flex-col items-end max-w-[80%]">
                    ${imgHtml}
                    ${text ? `<div class="bg-gray-100 px-4 py-2.5 rounded-2xl rounded-tr-sm text-gray-800 leading-relaxed text-[15px] break-words whitespace-pre-wrap">${escapeHTML(text)}</div>` : ''}
                </div>
            `;
            chatContainer.appendChild(msgDiv);
            scrollToBottom();
        }

        function appendBotLoading() {
            const msgDiv = document.createElement('div');
            msgDiv.className = 'flex gap-4 items-start w-full';
            msgDiv.id = 'current-loading';
            msgDiv.innerHTML = `
                <div class="w-8 h-8 rounded-full bg-indigo-100 flex items-center justify-center shrink-0 border border-indigo-200">
                    <svg class="w-5 h-5 text-indigo-600 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"></path></svg>
                </div>
                <div class="flex-1 pt-2">
                    <div class="loader-dots relative w-16 h-4">
                        <div class="absolute top-0 w-2 h-2 rounded-full bg-indigo-400"></div>
                        <div class="absolute top-0 w-2 h-2 rounded-full bg-indigo-400"></div>
                        <div class="absolute top-0 w-2 h-2 rounded-full bg-indigo-400"></div>
                        <div class="absolute top-0 w-2 h-2 rounded-full bg-indigo-400"></div>
                    </div>
                </div>
            `;
            chatContainer.appendChild(msgDiv);
            scrollToBottom();
            return msgDiv;
        }

        function updateBotMessage(msgDiv, contentHtml) {
            msgDiv.removeAttribute('id');
            msgDiv.querySelector('.flex-1').innerHTML = contentHtml;
            scrollToBottom();
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, tag => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
            }[tag]));
        }

        // ============== 核心：发送与 API 请求 ==============
        async function sendMessage() {
            const apiKey = localStorage.getItem('vsllm_api_key');
            if (!apiKey) { openSettings(); return; }

            const promptText = promptInput.value.trim();
            if (!promptText && pendingImages.length === 0) return;

            // 1. 记录输入并清空状态
            const imagesToSend = [...pendingImages];
            appendUserMessage(promptText, imagesToSend);
            
            promptInput.value = '';
            promptInput.style.height = 'auto';
            pendingImages = [];
            renderImagePreviews();
            
            const loadingDiv = appendBotLoading();
            sendBtn.disabled = true;

            // 2. 构造 Content 数组 (支持多模态输入)
            let contentArray = [];
            if (promptText) {
                contentArray.push({
                    type: 'input_text',
                    text: `Use the image_generation tool to generate exactly one image. 不要输出长篇文字说明，只生成图片。提示词：${promptText}`
                });
            } else {
                contentArray.push({
                    type: 'input_text',
                    text: `Use the image_generation tool to generate exactly one image. 不要输出长篇文字说明，只生成图片。请根据我上传的图片生成。`
                });
            }

            // 追加 Base64 图像
            imagesToSend.forEach(b64 => {
                contentArray.push({
                    type: 'image_url',
                    image_url: { url: b64 }
                });
            });

            const payload = {
                model: MODEL,
                input: [{
                    role: 'user',
                    content: contentArray
                }],
                tools: [{
                    type: 'image_generation',
                    model: 'gpt-image-2',
                    output_format: 'png',
                    quality: 'high',
                    size: '1024x1024'
                }],
                instructions: 'You are a helpful assistant. Always call image_generation when the user asks for an image. Do not answer with only text.',
                tool_choice: { type: 'image_generation' },
                stream: false,
                store: false
            };

            try {
                const response = await fetch(BASE_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                if (!response.ok) throw new Error(data.error?.message || JSON.stringify(data));

                // 3. 提取生成的图片 (按照原 Python 脚本兜底提取)
                let imgB64 = null;
                const outputs = data.output || [];
                for (let item of outputs) {
                    if (item.type === 'image_generation_call' && item.result) {
                        imgB64 = item.result; break;
                    }
                }
                if (!imgB64) {
                    for (let item of outputs) {
                        if (item.type === 'image_generation_call') {
                            imgB64 = item.image_base64 || item.b64_json;
                            if (imgB64) break;
                        }
                    }
                }

                if (!imgB64) {
                    throw new Error("API 返回成功，但未能提取到图片数据。");
                }

                // 4. 显示结果
                const imgSrc = `data:image/png;base64,${imgB64}`;
                const ts = new Date().toISOString().replace(/[-:T]/g, '').slice(0, 14);
                const fileName = `image-${ts}.png`;
                
                const resultHtml = `
                    <div class="relative group inline-block">
                        <img src="${imgSrc}" class="rounded-xl max-w-full max-h-[400px] object-contain shadow-sm border border-gray-200">
                        <div class="absolute inset-0 bg-black bg-opacity-0 group-hover:bg-opacity-20 transition-all rounded-xl flex items-center justify-center opacity-0 group-hover:opacity-100">
                            <button onclick="downloadImage('${imgSrc}', '${fileName}')" class="bg-white text-black px-4 py-2 rounded-lg font-medium shadow-lg flex items-center gap-2 hover:bg-gray-50 transition-colors">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                                下载原图
                            </button>
                        </div>
                    </div>
                `;
                updateBotMessage(loadingDiv, resultHtml);

                // 5. 存入本地图库
                saveToGallery(imgSrc, promptText || '参考图生成');

            } catch (error) {
                console.error("请求失败:", error);
                updateBotMessage(loadingDiv, `
                    <div class="bg-red-50 text-red-600 px-4 py-3 rounded-lg border border-red-200 text-sm">
                        <div class="font-bold flex items-center gap-1 mb-1">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            生成失败
                        </div>
                        <div class="break-words">${escapeHTML(error.message)}</div>
                    </div>
                `);
            } finally {
                sendBtn.disabled = false;
                promptInput.focus();
            }
        }

        function downloadImage(dataUrl, filename) {
            const link = document.createElement('a');
            link.href = dataUrl;
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // ============== IndexedDB 本地图库逻辑 ==============
        let db;
        const DB_NAME = "VsllmGallery";
        const STORE_NAME = "images";

        function initDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, 1);
                request.onupgradeneeded = (e) => {
                    db = e.target.result;
                    if (!db.objectStoreNames.contains(STORE_NAME)) {
                        db.createObjectStore(STORE_NAME, { keyPath: "id" });
                    }
                };
                request.onsuccess = (e) => {
                    db = e.target.result;
                    resolve();
                };
                request.onerror = (e) => reject(e);
            });
        }

        function saveToGallery(base64Data, promptStr) {
            if (!db) return;
            const tx = db.transaction(STORE_NAME, "readwrite");
            const store = tx.objectStore(STORE_NAME);
            const item = {
                id: Date.now(),
                base64: base64Data,
                prompt: promptStr,
                time: new Date().toLocaleString()
            };
            store.put(item);
            tx.oncomplete = () => loadGallery();
        }

        function loadGallery() {
            if (!db) return;
            const tx = db.transaction(STORE_NAME, "readonly");
            const store = tx.objectStore(STORE_NAME);
            const request = store.getAll();
            
            request.onsuccess = () => {
                const items = request.result.sort((a, b) => b.id - a.id); // 倒序
                const container = document.getElementById('gallery-container');
                if (items.length === 0) {
                    container.innerHTML = `<div class="col-span-2 text-center text-gray-400 text-sm mt-10">图库为空，快去生成吧</div>`;
                    return;
                }
                
                container.innerHTML = items.map(item => `
                    <div class="relative group rounded-lg overflow-hidden border border-gray-200 aspect-square bg-gray-100 cursor-pointer">
                        <img src="${item.base64}" class="w-full h-full object-cover" onclick="downloadImage('${item.base64}', 'image-${item.id}.png')" title="${escapeHTML(item.prompt)}">
                        <button onclick="deleteFromGallery(${item.id})" class="absolute top-1 right-1 bg-white bg-opacity-80 text-red-500 rounded p-1 opacity-0 group-hover:opacity-100 transition-opacity hover:bg-red-50" title="删除">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                        </button>
                    </div>
                `).join('');
            };
        }

        function deleteFromGallery(id) {
            if (!confirm('确定删除这张历史图片吗？')) return;
            const tx = db.transaction(STORE_NAME, "readwrite");
            tx.objectStore(STORE_NAME).delete(id);
            tx.oncomplete = () => loadGallery();
        }
    </script>
</body>
</html>
